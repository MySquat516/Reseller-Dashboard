<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmelden · Reseller Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181d27" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0f1218; --surface:#181d27; --surface-2:#212838; --border:#2c3548; --text:#e8ecf4; --muted:#8b95ab; --accent:#5b9dff; --bad:#ff6b6b; --on-accent:#0f1218; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6fa; --surface:#fff; --surface-2:#eef1f7; --border:#d9deea; --text:#1b2130; --muted:#647089; --accent:#2563d6; --bad:#c23030; --on-accent:#fff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
         font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 1.15rem; }
  h1 img { height: 32px; width: auto; }
  label { display: block; margin-bottom: 14px; font-size: .85rem; color: var(--muted); }
  input { display: block; width: 100%; margin-top: 6px; min-height: 44px; padding: 8px 10px; font: inherit; color: var(--text);
          background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { width: 100%; min-height: 44px; margin-top: 4px; font: inherit; font-weight: 600; color: var(--on-accent);
           background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  .err { margin: 0 0 14px; padding: 8px 10px; font-size: .85rem; color: var(--bad); border: 1px solid var(--bad); border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1><img src="/logo.svg" alt="">Reseller Dashboard</h1>
  {{ERROR}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{NEXT}}">
    <label>Benutzername
      <input name="username" value="{{USER}}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required {{FOCUS_USER}}>
    </label>
    <label>Passwort
      <input name="password" type="password" autocomplete="current-password" required {{FOCUS_PASS}}>
    </label>
    <button type="submit">Anmelden</button>
  </form>
</main>
</body>
</html>
