services:
  reseller:
    # Fertiges Image aus der GitHub Container Registry (wird bei jedem Push auf main automatisch gebaut).
    # Update: docker compose pull && docker compose up -d
    image: ghcr.io/mysquat516/reseller-dashboard:latest
    # Fallback: selbst bauen mit  docker compose up -d --build
    build:
      context: .
      network: host               # <--- Zwingt den Build, dein echtes Internet/DNS zu nutzen
    container_name: reseller-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"      # anderer Host-Port: PORT=8080 docker compose up -d
    environment:
      TZ: Europe/Berlin
      # Optional (siehe README, Abschnitt Backup):
      # BACKUP_KEEP: 14             # Tage automatischer Sicherungen
      # BACKUP_AUTO: 0              # 0 = tägliche Sicherung aus
      # APP_PASSWORD: ein-langes-passwort   # schaltet den Passwortschutz ein (siehe README)
      # APP_USER: admin
    volumes:
      - ./data:/data              # SQLite-Datenbank (reseller.db) und hochgeladene Bilder (uploads/)
    # Healthcheck steckt bereits im Image (Dockerfile) und fragt /healthz ab.
